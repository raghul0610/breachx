name: Backend checks

on:
  push:
    branches:
      - backend
    paths:
      - "api/**"
      - "tests/**"
      - "types/**"
      - ".env.example"
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/backend-checks.yml"
  pull_request:
    paths:
      - "api/**"
      - "tests/**"
      - "types/**"
      - ".env.example"
      - "src/**"
      - "supabase/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"
      - ".github/workflows/backend-checks.yml"

jobs:
  frontend-and-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Bootstrap isolated Supabase-compatible test schema
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid
            language sql stable
            as $$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          create table public.admin_audit_logs (id uuid primary key);
          alter table public.admin_audit_logs enable row level security;
          -- Reproduce the overly broad grants observed in production so the hardening migration is tested.
          grant all on table public.admin_audit_logs to anon, authenticated;
          SQL
      - name: Apply projects migration to ephemeral PostgreSQL
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010070000_create_projects.sql
      - name: Apply admin audit log access hardening migration
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010080000_harden_admin_audit_log_access.sql
      - name: Create GitHub connection table
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261016090000_github_connections.sql
          psql -v ON_ERROR_STOP=1 -c "grant all on table public.github_connections to anon, authenticated"
      - name: Harden GitHub connection access
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261019090000_harden_github_connections.sql
      - name: Assert projects schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/projects_migration_assertions.sql
      - name: Assert admin audit logs are server-only
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/admin_audit_log_access.sql
      - name: Assert GitHub connection metadata is owner-readable and server-writable
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/github_connections_access.sql
      - name: Test owner isolation and submitted-project editing
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/projects_rls_behavior.sql
